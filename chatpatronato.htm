<font face="Arial,Helvetica" color="#000000" size=-1>iRC-Hispano.Org JavaChat</font>

<applet code="HispanoChat.class" align="middle" width="320" height="250"
archive="HispanoChat.jar">

<!-- parametros obligatorios y no variables //-->
<param name="code" value="HispanoChat.class">
<param name="codeBase" value="http://www.irc-hispano.org/demochat/">
<param name="archive" value="HispanoChat.jar">
<param name="Server" value="www.irc-hispano.org">
<param name="NodeName" value="Luna">

<!-- parametros opcionales y/o variables //-->

<!-- los siguientes 5 parametros solo son utiles cuando el código //-->
<!-- este es generado dinamicamente por un cgi o javascript //-->
<!--
<!-- solo ponerlo si se quiere usar un nick fijo //-->
<param name="Nick" value="minick">
<!-- solo ponerlo si se quiere usar un password fijo //-->
<param name="Password" value="">
<!-- solo ponerlo si se quiere variar el de defecto que es 'Applet' //-->
<param name="Ident" value="ident">
<!-- solo ponerlo si se quiere variar el de defecto que es 'sin info' //-->
<param name="Info" value="">
<!-- autoconexión sin paasr por la ventana de datos//-->
<param name="AutoStart" value="OFF">
//-->
<!-- canal por defecto //-->
<param name="Canal" value="#patronato">
<!-- posibilidada de cambiar de canal (no operativo actualmente) //-->
<param name="Restricted" value="OFF">
<!-- Fondo oscuro //-->
<param name="DarkMode" value="OFF">
<!-- Sin mensajes del ircd (no operativo actualmente //-->
<param name="Conference" value="OFF">
<!-- mensaje de salida //-->
<param name="QuitMessage" value="bye">
<!-- Identificacion automatica a NiCK //-->
<param name="OldIdent" value="ON">
<!-- Formato de fechas largo //-->
<param name="LongTime" value="ON">

<!-- Colores personalizables//-->
<!-- Color de la fuente de las pestañas //-->
<param name="TabTextColor" value="0000000">
<!-- Color de la fuente de las pestañas con datos nuevos //-->
<param name="TabNotTextColor" value="00FF0000">
<!-- Color de la fuente de las pestañas con datos nuevos y referencias a nuestro nick//-->
<param name="TabSuperNotTextColor" value="0000FF00">
<!-- Color de fondo de los widgets //-->
<param name="WidgetBackColor" value="00CCCCCC">
<!-- Color de la fuente de los widgets //-->
<param name="WidgetForeColor" value="00000000">
<!-- Color de fondo de la ventana //-->
<param name="BackColor" value="00DDDDDD">
<!-- Color de la fuente de la ventana //-->
<param name="ForeColor" value="00000000">
<!-- Color de fondo de los botones //-->
<param name="ButtonBackColor" value="00CCCCCC">
<!-- Color de la fuente de los botones //-->
<param name="ButtonForeColor" value="00000000">

<!-- Cadenas personalizables //-->
<param name="strNick" value="Nick:">
<param name="strPasswd" value="Password:">
<param name="strEmail" value="Email:">
<param name="strChannel" value="Canal:">
<param name="strConnect" value="Connect!!">
<param name="strApply" value="Aplicar">
<param name="strChangeNick" value="Nuevo Nick:">
<param name="strChannel" value="Canal:">
<param name="strColor" value="Color Fondo:">
<param name="strColorDay" value="Blanco">
<param name="strColorNight" value="Negro">
<param name="strConnect" value="Conectar">
<param name="strDisconnect" value="Desconectar">
<param name="strEmail" value="Email:">
<param name="strFont" value="Fuente:">
<param name="strMode" value="EL Modo:">
<param name="strModeConference" value="Conferencia">
<param name="strModeIRC" value="Irc">
<param name="strNick" value="Nick:">
<param name="strPasswd" value="Password:">

<param name="FontSize" value="14">
<param name="FontFace" value="helvetica">

</font>
